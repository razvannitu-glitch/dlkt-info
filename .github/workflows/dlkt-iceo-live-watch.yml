name: DLKT INFO live ICEO freshness watch

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dlkt-live-iceo-watch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-read:
    name: Check published ICEO revision and scheduler freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout monitor from default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Exercise fail-closed monitor against offline fixtures
        run: node --test tests/iceo-live-readback.test.mjs
      - name: Check public HTTPS ICEO API without credentials or writes
        run: node scripts/verify-iceo-live.mjs
