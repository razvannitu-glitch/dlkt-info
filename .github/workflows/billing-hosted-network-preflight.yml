name: DLKT hosted network preflight
on:
  push:
    branches: [billing-lab/integration-20261126]
    paths:
      - '.github/workflows/billing-hosted-network-preflight.yml'
      - 'docs/hosted-integration/transport/prod-ca-2021.crt'
permissions:
  contents: read
jobs:
  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify uploaded CA and pooler TLS without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, socket, ssl, struct
          from pathlib import Path
          host='aws-0-eu-central-1.pooler.supabase.com'
          cert=Path('docs/hosted-integration/transport/prod-ca-2021.crt')
          pem=cert.read_bytes()
          assert hashlib.sha256(pem).hexdigest()=='700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7', 'UPLOADED_CA_BYTES_MISMATCH'
          der=ssl.PEM_cert_to_DER_cert(pem.decode('ascii'))
          assert hashlib.sha256(der).hexdigest()=='807025ad50d4ed219d2c9c7d299c004f824eb00cf7f65afef607d07b72e6cafa', 'CA_FINGERPRINT_MISMATCH'
          ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
          ctx.minimum_version=ssl.TLSVersion.TLSv1_2
          ctx.load_verify_locations(cafile=str(cert))
          assert ctx.verify_mode==ssl.CERT_REQUIRED and ctx.check_hostname
          result={'host':host,'port':5432,'ca_fingerprint_verified':True,'tcp_reachable':False,'postgres_accepts_tls':False,'ca_and_hostname_verified':False,'tls_version':None,'failure_code':None}
          try:
              for af,kind,proto,_,address in socket.getaddrinfo(host,5432,socket.AF_INET,socket.SOCK_STREAM)[:4]:
                  with socket.socket(af,kind,proto) as sock:
                      sock.settimeout(5)
                      try:
                          sock.connect(address)
                          result['tcp_reachable']=True
                          sock.sendall(struct.pack('!II',8,80877103))
                          result['postgres_accepts_tls']=sock.recv(1)==b'S'
                          if not result['postgres_accepts_tls']:
                              result['failure_code']='POSTGRES_TLS_UNAVAILABLE'
                              continue
                          with ctx.wrap_socket(sock,server_hostname=host) as tls:
                              result['ca_and_hostname_verified']=True
                              result['tls_version']=tls.version()
                              result['failure_code']=None
                              break
                      except ssl.SSLCertVerificationError:
                          result['failure_code']='CERTIFICATE_VALIDATION_FAILED'
                      except OSError:
                          result['failure_code']='TCP_OR_TLS_UNAVAILABLE'
          except socket.gaierror:
              result['failure_code']='DNS_UNAVAILABLE'
          print('DLKT_HOSTED_CA_PREFLIGHT '+json.dumps(result,sort_keys=True))
          if not result['ca_and_hostname_verified']:
              raise SystemExit(1)
          PY
