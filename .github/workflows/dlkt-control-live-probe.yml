name: DLKT Control live anonymous boundary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  anonymous:
    if: github.head_ref == 'qa/dlkt-control-live'
    name: Query-free official admin read-back
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify live public boundary without credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const checks=[];
          // Require the corrected live release before the anonymous probe.
          let verified=false;
          for(let attempt=0;attempt<15;attempt++){
            try{
              const response=await fetch('https://www.dlkt.ee/release.json',{cache:'no-store',signal:AbortSignal.timeout(5000)});
              const receipt=await response.json();
              if(response.ok&&receipt.gitCommitSha==='71dff1e711a33fe87950349e2cf79d2c1e8f74ae'){verified=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          assert.equal(verified,true,'exact production revision not visible');
          for (const [path, expected, phrase] of [
            ['/admin', 401, 'Sign in required'],
            ['/api/admin', 401, 'Sign in required'],
            ['/admin?range=24h', 401, 'Sign in required'],
            ['/admin?utm_source=chatgpt.com', 401, 'Sign in required'],
            ['/admin?range=24h&utm_source=chatgpt.com', 401, 'Sign in required'],
            ['/admin?range=invalid', 400, 'Invalid time range'],
            ['/admin?utm_source=chatgpt.com&utm_source=chatgpt.com', 400, 'Invalid time range'],
            ['/admin?utm_source=evil.example', 400, 'Invalid time range'],
            ['/admin?range=7d&user=other', 400, 'Invalid time range']
          ]) {
            const response=await fetch('https://www.dlkt.ee'+path,{method:'GET',redirect:'manual',credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(15000)});
            const body=await response.text();
            const check={path,status:response.status,expected,bodyMatches:body.includes(phrase),privateNoStore:/private.*no-store/i.test(response.headers.get('cache-control')??''),noindex:/noindex/i.test(response.headers.get('x-robots-tag')??''),noCookie:!response.headers.has('set-cookie')};
            console.log(JSON.stringify(check));
            assert.equal(check.status,expected,path);
            assert.ok(check.bodyMatches&&check.privateNoStore&&check.noindex&&check.noCookie,path);
            assert.ok(!body.includes('Unique visitors'),path);
            if (expected===400) assert.ok(body.includes('href="/admin">Open Control with the default time range'),path);
            checks.push(check);
          }
          console.log('DLKT_ADMIN_LIVE_ANONYMOUS_PASS '+JSON.stringify({requests:checks.length,scope:'public HTTPS; no authenticated browser or analytics data tested'}));
          JS
