name: DLKT Control live anonymous boundary
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  anonymous:
    if: github.head_ref == 'qa/dlkt-control-live'
    name: Query-free official admin read-back
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify live public boundary without credentials
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const checks=[];
          // Require the corrected live release before the anonymous probe.
          let verified=false;
          for(let attempt=0;attempt<15;attempt++){
            try{
              const response=await fetch('https://www.dlkt.ee/release.json',{cache:'no-store',signal:AbortSignal.timeout(5000)});
              const receipt=await response.json();
              if(response.ok&&receipt.gitCommitSha==='a37d754e7ee8d04793b9032ff1cfe049148ae0f4'){verified=true;break;}
            }catch{}
            await new Promise(resolve=>setTimeout(resolve,3000));
          }
          assert.equal(verified,true,'exact production revision not visible');
          for (const [path, expected, phrase] of [
            ['/admin', 401, 'Sign in required'],
            ['/api/admin', 401, 'Sign in required'],
            ['/admin?range=24h', 401, 'Sign in required'],
            ['/admin?utm_source=chatgpt.com', 401, 'Sign in required'],
            ['/admin?range=24h&utm_source=chatgpt.com', 401, 'Sign in required'],
            ['/admin?range=invalid', 400, 'Invalid time range'],
            ['/admin?utm_source=chatgpt.com&utm_source=chatgpt.com', 400, 'Invalid time range'],
            ['/admin?utm_source=evil.example', 400, 'Invalid time range'],
            ['/admin?range=7d&user=other', 400, 'Invalid time range']
          ]) {
            const response=await fetch('https://www.dlkt.ee'+path,{method:'GET',redirect:'manual',credentials:'omit',cache:'no-store',signal:AbortSignal.timeout(15000)});
            const body=await response.text();
            const check={path,status:response.status,expected,bodyMatches:body.includes(phrase),privateNoStore:/private.*no-store/i.test(response.headers.get('cache-control')??''),noindex:/noindex/i.test(response.headers.get('x-robots-tag')??''),noCookie:!response.headers.has('set-cookie')};
            console.log(JSON.stringify(check));
            assert.equal(check.status,expected,path);
            assert.ok(check.bodyMatches&&check.privateNoStore&&check.noindex&&check.noCookie,path);
            assert.ok(!body.includes('Unique visitors'),path);
            if (expected===400) assert.ok(body.includes('href="/admin">Open Control with the default time range'),path);
            checks.push(check);
          }

          const edge='https://gxzpvuyawpzevwwbrlpz.supabase.co/functions/v1/dlkt-control-profile-count?range=7d';
          for (const [label,headers] of [
            ['missing-authorization',{}],
            ['malformed-token',{'Authorization':'Bearer invalid'}],
            ['forged-jwt',{'Authorization':'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYXV0aGVudGljYXRlZCJ9.invalid'}]
          ]){
            const r=await fetch(edge,{method:'GET',headers,credentials:'omit',cache:'no-store',redirect:'manual',signal:AbortSignal.timeout(15000)});
            const body=await r.text();
            assert.ok(r.status===401||r.status===403,label+' returned '+r.status);
            assert.ok(!body.includes('"profiles"')&&!body.includes('"newProfiles"')&&!body.includes('sb_secret_'),label+' aggregate disclosure');
            console.log(JSON.stringify({profileEdge:label,status:r.status,noAggregates:true}));
          }
          console.log('DLKT_PROFILE_EDGE_HOSTED_DENIAL_PASS');



          // Read only: verify canonical-domain hints and the alternate-domain redirect.
          // Compare different-country and same-country spoof pairs. Do not log location.
          const hint='https://www.dlkt.ee/api/places?hint=1';
          const request=async(url,headers={})=>fetch(url,{headers,redirect:'manual',cache:'no-store',credentials:'omit',signal:AbortSignal.timeout(15000)});
          const read=async(headers={})=>{
            const res=await request(hint,headers);
            assert.equal(res.status,200);
            assert.match(res.headers.get('cache-control')??'',/no-store/);
            const v=await res.json();
            assert.equal(v.estimated,true);
            assert.ok(typeof v.countryCode==='string'&&/^[A-Z]{2}$/.test(v.countryCode),'missing country');
            return {country:v.countryCode,city:v.city??null};
          };
          const before=await read();
          const candidateNames={US:['New York','Los Angeles','Chicago','Houston'],GB:['London','Manchester','Birmingham'],DE:['Berlin','Hamburg','Munich'],NL:['Amsterdam','Rotterdam','Utrecht'],BE:['Brussels','Antwerp','Ghent'],FR:['Paris','Lyon','Marseille'],IE:['Dublin','Cork','Galway'],RO:['Bucharest','Cluj-Napoca','Timisoara'],CA:['Toronto','Montreal','Vancouver'],FI:['Helsinki','Tampere','Turku'],SE:['Stockholm','Gothenburg','Malmo']};
          const choices=candidateNames[before.country]??[];
          const valid=[];
          for(const name of choices){
            const res=await request('https://www.dlkt.ee/api/places?q='+encodeURIComponent(name));
            assert.equal(res.status,200);
            const data=await res.json();
            const match=(data.cities??[]).find(x=>x.countryCode===before.country&&(x.name===name||x.name?.toLowerCase()===name.toLowerCase()));
            if(match&&JSON.stringify(match)!==JSON.stringify(before.city))valid.push(name);
            if(valid.length===2)break;
          }
          assert.equal(valid.length,2,'no two independently catalogued same-country city candidates; inconclusive');
          const pairs=[['IS','Reykjavik'],['SG','Singapore'],...valid.map(city=>[before.country,city])];
          for(const [country,city] of pairs){
            const actual=await read({'X-Vercel-IP-Country':country,'X-Vercel-IP-City':city});
            assert.ok(JSON.stringify(before)===JSON.stringify(actual),'client supplied geography altered hint');
          }
          const after=await read();
          assert.ok(JSON.stringify(before)===JSON.stringify(after),'baseline changed; inconclusive');
          const alternate=await request('https://info.dlkt.ee/api/places?hint=1',{'X-Vercel-IP-Country':'IS','X-Vercel-IP-City':'Reykjavik'});
          assert.ok([301,302,307,308].includes(alternate.status),'alternate origin did not redirect');
          const redirect=new URL(alternate.headers.get('location')??'', 'https://info.dlkt.ee');
          assert.equal(redirect.origin,'https://www.dlkt.ee');
          console.log('DLKT_GEO_HINT_INGRESS_PASS '+JSON.stringify({host:'www.dlkt.ee',countryAvailable:true,cityMapped:before.city!==null,spoofPairsRejected:pairs.length,alternateCanonicalRedirect:true}));
          console.log('DLKT_ADMIN_LIVE_ANONYMOUS_PASS '+JSON.stringify({requests:checks.length,scope:'public HTTPS; no authenticated browser or analytics data tested'}));
          JS
