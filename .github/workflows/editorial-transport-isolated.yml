name: DLKT isolated editorial exposure transactions
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'docs/editorial-transport-lab/**'
      - '.github/workflows/editorial-transport-isolated.yml'
permissions:
  contents: read
jobs:
  transactions:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/dlkt-editorial-intelligence-aggregate-foundation'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: editorial_transport_test
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        options: >-
          --health-cmd "pg_isready -U postgres -d editorial_transport_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install disposable schema and fixture-only role boundaries
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$TEST_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d editorial_transport_test < docs/editorial-transport-lab/schema.sql
      - name: Exercise authenticated independent connections, rollback, replay and revocation
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: node --test docs/editorial-transport-lab/transactions.test.mjs
      - name: Build canonical parser and strictly check isolated adapter
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          ./node_modules/.bin/tsc --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --target ES2022 --module NodeNext --moduleResolution NodeNext --types node --noEmit docs/editorial-transport-lab/readback-adapter.mts
      - name: Verify parser-to-transaction binding and private Control projection
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: node --experimental-strip-types --test docs/editorial-transport-lab/readback-adapter.test.mjs
      - name: Install disposable daily window variant only after baseline tests
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$TEST_CONTAINER" psql -X -v ON_ERROR_STOP=1 -U postgres -d editorial_transport_test < docs/editorial-transport-lab/daily-window.sql
      - name: Verify fixed-window sealing, suppression, retention and concurrent withdrawal
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: node --test docs/editorial-transport-lab/daily-window.test.mjs
      - name: Strictly check isolated daily readback and Control preview
        run: |
          set -euo pipefail
          ./node_modules/.bin/tsc --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --target ES2022 --module NodeNext --moduleResolution NodeNext --types node --allowImportingTsExtensions --noEmit docs/editorial-transport-lab/daily-readback.mts docs/editorial-transport-lab/control-preview.mts
      - name: Verify sealed readback and existing Control shell using synthetic data only
        env:
          TEST_CONTAINER: ${{ job.services.postgres.id }}
        run: node --experimental-strip-types --test docs/editorial-transport-lab/control-preview.test.mjs
