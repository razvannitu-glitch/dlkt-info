name: DLKT INFO live public reader browser QA

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor current public state or verify exact release recovery
        type: choice
        options: [monitor, recovery]
        default: monitor
      origin:
        description: Exact public or isolated DLKT Vercel deployment HTTPS origin
        type: string
        default: https://www.dlkt.ee
      expected_commit:
        description: Required exact 40-character release SHA in recovery mode
        type: string
        required: false
      expected_manifest:
        description: Required exact 64-character release manifest SHA256 in recovery mode
        type: string
        required: false

env:
  DLKT_KNOWLEDGE_PROBE_MODE: ${{ inputs.mode || 'monitor' }}
  DLKT_KNOWLEDGE_PROBE_ORIGIN: ${{ inputs.origin || 'https://www.dlkt.ee' }}
  DLKT_KNOWLEDGE_EXPECTED_COMMIT: ${{ inputs.expected_commit || '' }}
  DLKT_KNOWLEDGE_EXPECTED_MANIFEST: ${{ inputs.expected_manifest || '' }}

permissions:
  contents: read

concurrency:
  group: dlkt-live-reader-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anonymous-public-knowledge:
    name: Direct public knowledge distribution HTTP boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies for semantic HTML verification
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the HTTP probe against offline fixtures
        run: node --test tests/live-knowledge-distribution.test.mjs
      - name: Verify exact NSW routes on the public domain
        run: node scripts/verify-live-knowledge.mjs

  anonymous-public-reader:
    name: Live website screenshots and responsive interaction QA
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies for shared probe contracts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve installed Chrome executable
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser" || { echo "No installed Chromium-compatible browser"; exit 1; }
          printf 'DLKT_CHROME_BIN=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Validate QA script syntax
        run: node --check scripts/qa-live-reader.mjs
      - name: Inspect public homepage on four viewports
        run: node scripts/qa-live-reader.mjs
      - name: Verify credential-free account probe against offline fixtures
        if: env.DLKT_KNOWLEDGE_PROBE_MODE == 'monitor'
        run: node --test tests/anonymous-account-live.test.mjs
      - name: Verify production anonymous account and session HTTP boundary
        if: env.DLKT_KNOWLEDGE_PROBE_MODE == 'monitor'
        run: node scripts/verify-anonymous-account.mjs
      - name: Preserve screenshots and measured browser report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dlkt-live-reader-browser-report
          path: ${{ runner.temp }}/dlkt-live-reader
          retention-days: 7
          if-no-files-found: ignore
