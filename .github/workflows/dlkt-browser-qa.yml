name: DLKT INFO browser QA (offline public reader)

on:
  push:
    branches:
      - "codex/dlkt-ui-browser-smoke-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dlkt-browser-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser QA at 320, 360, 390, 430, 768 and 1440px
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build isolated prelaunch surface and attest source pin
        run: npm run package:local && npm run qa:prelaunch && npm run build
      - name: Resolve installed headless browser
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser" || { echo "No installed Chromium-compatible browser"; exit 1; }
          printf 'DLKT_CHROME_BIN=%s\n' "$browser" >> "$GITHUB_ENV"
      - name: Measure offline reader in headless Chrome
        run: node scripts/qa-browser.mjs
      - name: Upload viewport screenshots and measured report (7 days)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dlkt-offline-browser-qa
          path: ${{ runner.temp }}/dlkt-ui-screenshots
          retention-days: 7
          if-no-files-found: ignore

